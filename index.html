<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walsh's</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Walsh's</h1>
      <p class="site-subtitle">The Website Homepage</p>
    </div>
  </header>

  <main>
    <section class="gallery container">
      <h2>Photos</h2>
      <p class="gallery-intro">Swap the images in the <code>images/</code> folder to replace these placeholders.</p>
      <div class="gallery-grid">
        <figure class="photo" data-name="images/photo1.jpg">
          <img src="images/photo1.jpg" alt="Photo 1" onerror="this.parentElement.classList.add('missing')" />
          <figcaption>Photo 1</figcaption>
        </figure>
        <figure class="photo" data-name="images/photo2.jpg">
          <img src="images/photo2.jpg" alt="Photo 2" onerror="this.parentElement.classList.add('missing')" />
          <figcaption>Photo 2</figcaption>
        </figure>
        <figure class="photo" data-name="images/photo3.jpg">
          <img src="images/photo3.jpg" alt="Photo 3" onerror="this.parentElement.classList.add('missing')" />
          <figcaption>Photo 3</figcaption>
        </figure>
        <figure class="photo" data-name="images/photo4.jpg">
          <img src="images/photo4.jpg" alt="Photo 4" onerror="this.parentElement.classList.add('missing')" />
          <figcaption>Photo 4</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Walsh's</p>
    </div>
  </footer>

</body>
</html>
